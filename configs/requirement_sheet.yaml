# Frozen requirement sheet: BOTH lenses are designed to exactly this (Round 1, Day 1 deliverable).
# Deviation from Round 1: field of view reduced from the 40 deg target to 20 deg full field,
# reduced for BOTH lenses, as Round 1 allowed ("if reduced, reduced for both").
# Reason: with four/two spherical elements and a simple optimiser, wider fields did not converge.
imaging_task: retinal imaging objective, simplified infinite-conjugate model eye, no illumination path
half_fov_deg: 10.0
epd_mm: 6.0
efl_mm: 30.0
wavelengths_um: [0.4861, 0.5876, 0.6563]   # green (0.5876) primary / weighted most
render_px_um: 10.0      # working-resolution pixel pitch used by the v0 renderer (binned, not a real sensor)
noise_sigma: 0.005      # additive Gaussian sensor noise, same for every condition
temperature_c: [15, 35]  # NOT yet evaluated (Day 4)
mtf_floor: TBD          # to be fixed before any polymer result is used for decisions
