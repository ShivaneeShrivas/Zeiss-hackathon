<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrugalOptiX · phone benchmark</title>
<style>body{font-family:system-ui,sans-serif;background:#0A0720;color:#F3F0FF;max-width:640px;margin:0 auto;padding:20px}button{font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:0;background:#2DE2E6;color:#0A0720}pre{background:#171046;padding:12px;border-radius:12px;white-space:pre-wrap}</style></head><body>
<h1>Restorer speed on THIS device</h1>
<p>Open this page on the phone (served over your Wi-Fi: <code>python -m http.server 8000 --directory web</code>). It runs the exported restorer with ONNX Runtime Web (WASM) and reports median latency. Quote this number as <b>Measured on &lt;phone model&gt;</b>.</p>
<p><label>Image size <select id="sz"><option>128</option><option selected>256</option></select></label> <button id="go">Run benchmark</button></p><pre id="out">Waiting.</pre>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script>
const out=document.getElementById('out');
document.getElementById('go').onclick=async()=>{
  try{const n=+document.getElementById('sz').value;out.textContent='Loading model...';
    const s=await ort.InferenceSession.create('models/restorer.onnx',{executionProviders:['wasm']});
    const x=new ort.Tensor('float32',new Float32Array(3*n*n).fill(0.5),[1,3,n,n]);const name=s.inputNames[0];
    for(let i=0;i<3;i++)await s.run({[name]:x});
    const t=[];for(let i=0;i<20;i++){const a=performance.now();await s.run({[name]:x});t.push(performance.now()-a);}
    t.sort((a,b)=>a-b);out.textContent='Device: '+navigator.userAgent+'\nImage: '+n+'x'+n+'\nMedian: '+t[10].toFixed(1)+' ms\nP90: '+t[18].toFixed(1)+' ms\nBackend: WASM (CPU). Note: the exported model must match the size (export with --size '+n+').';
  }catch(e){out.textContent='Error: '+e.message+'\n(Copy runs/restorer.onnx to web/models/ and export at the same size.)';}};
</script></body></html>
